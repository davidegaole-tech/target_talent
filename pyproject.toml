[project]
name = "talent-passport"
version = "0.1.0"
description = "Talent Passport con tutor AI locale (Ollama): riassunti, quiz e flashcard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "reportlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
